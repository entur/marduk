# publiccode.yml metadata, see https://yml.publiccode.tools/
publiccodeYmlVersion: "0.7.0"

name: Marduk
url: https://github.com/entur/marduk

platforms:
  - web
  - linux

categories:
  - workflow-management
  - data-collection
  - geographic-information-systems

developmentStatus: stable
softwareType: standalone/backend

organisation:
  name: Entur AS
  uri: https://entur.no

usedBy:
  - Norway (nationwide), Entur AS

intendedAudience:
  scope:
    - transportation
  countries:
    - "NO"

description:
  en:
    localisedName: Marduk
    shortDescription: Orchestrates the Norwegian national timetable data pipeline.
    longDescription: >
      Marduk drives NeTEx and GTFS datasets through import, validation, export and publication, schedules nightly
      revalidation so time-dependent rules stay correct, and triggers GTFS conversion and journey planner graph
      rebuilds.
    documentation: https://github.com/entur/marduk/blob/master/README.md
    features:
      - Orchestrates the NeTEx and GTFS import pipeline
      - Ingests datasets via upload, REST API and PubSub
      - Schedules nightly revalidation and re-export
      - Publishes validated datasets as open data
      - Triggers OpenStreetMap download and graph rebuild

