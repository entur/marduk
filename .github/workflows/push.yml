name: Build and push
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  maven-verify:
    env:
      JFROG_USER: ${{ secrets.ARTIFACTORY_AUTH_USER }}
      JFROG_PASS: ${{ secrets.ARTIFACTORY_AUTH_TOKEN }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Copy maven settings
        run: |
          wget https://raw.githubusercontent.com/entur/ror-maven-settings/master/.m2/settings.xml -O .github/workflows/settings.xml
      - uses: actions/setup-java@v5
        with:
          java-version: 25.0.4
          distribution: liberica
      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            ${{ runner.os }}-maven-
            ${{ runner.os }}-

      - name: Run maven build
        run: ./mvnw verify -s .github/workflows/settings.xml
      - name: Sonar Scan
        env:
          SONAR_TOKEN: ${{ secrets.ENTUR_SONAR_PASSWORD }}
          SONAR_PROJECT_NAME: ${{ github.event.repository.name }}
          SONAR_PROJECT_KEY: entur_${{ github.event.repository.name }}
        run: |
          ./mvnw -s .github/workflows/settings.xml \
                  org.jacoco:jacoco-maven-plugin:prepare-agent verify \
                  org.jacoco:jacoco-maven-plugin:report sonar:sonar \
                  -Dmaven.main.skip \
                  -DskipTests \
                  -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
                  -Dsonar.organization=enturas-github \
                  -Dsonar.projectName=${SONAR_PROJECT_NAME} \
                  -Dsonar.host.url=https://sonarcloud.io \
                  -Dsonar.token=${SONAR_TOKEN}
      - uses: actions/upload-artifact@v7
        with:
          path: target
  openapi-lint:
    needs: [ maven-verify ]
    uses: entur/gha-api/.github/workflows/lint.yml@v6
    secrets: inherit
    with:
      path: 'src/main/resources/openapi/timetable-management/openapi.yaml'
  openapi-validate:
    needs: [ maven-verify ]
    uses: entur/gha-api/.github/workflows/validate.yml@v6
    secrets: inherit
    with:
      path: 'src/main/resources/openapi/timetable-management/openapi.yaml'
  openapi-publish:
    if: github.repository_owner == 'entur' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ openapi-lint, openapi-validate ]
    uses: entur/gha-api/.github/workflows/publish.yml@v6
    secrets: inherit
    with:
      path: 'src/main/resources/openapi/timetable-management/openapi.yaml'

  docker-smoke:
    needs: [ maven-verify ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: artifact
          path: target
      - run: docker build -t marduk:smoke .
      # Nothing else in CI runs the image. Reaching Spring's startup line proves the JRE accepted the
      # chart's JVM options and loaded the application bytecode; it then fails on config that only
      # exists in the cluster, which is fine. Anything earlier (wrong class file version, a flag the
      # JRE rejects) never gets that far.
      - run: |
          opts=$(awk '/JDK_JAVA_OPTIONS:/{f=1;next} f&&/^        [^ ]/{sub(/-Dspring.config.location=[^ ]*/,"");printf "%s ",$0;next} f{exit}' helm/marduk/values.yaml)
          docker run --rm -e JDK_JAVA_OPTIONS="$opts" marduk:smoke 2>&1 | tee smoke.log || true
          grep -q "using Java" smoke.log

  docker-build:
    if: github.repository_owner == 'entur' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [maven-verify, docker-smoke]
    uses: entur/gha-docker/.github/workflows/build.yml@v1
    with:
      build_artifact_name: artifact
      build_artifact_path: target
  docker-push:
    needs: [docker-build]
    uses: entur/gha-docker/.github/workflows/push.yml@v1
