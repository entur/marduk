marduk:
  database: marduk
common:
  app: marduk
  shortname: marduk
  team: ror
  deployment:
    replicas: 2
  container:
    labels: { customLogRetention: enabled }
    forceReplicas: 2
    image: <+artifacts.primary.image>
    memoryLimit: 8000
    memory: 7000
    cpu: 2
    envFrom:
      - secretRef:
          name: marduk-auth
    probes:
      # spec replaces the chart's whole probe block, which emits no timeoutSeconds and so gets
      # the 1s k8s default - too tight for a path that shares platform-http's task executor
      # with 150MB uploads. Both probes target /services/health because it is served by
      # platform-http itself: a pod whose Camel mappings never registered fails them, while
      # /actuator/health stays UP in that state. Liveness thresholds are deliberately slack so
      # executor saturation recycles nothing, but a permanently unmapped pod is still replaced.
      spec:
        livenessProbe:
          httpGet:
            path: /services/health
            port: 8080
          initialDelaySeconds: 140
          periodSeconds: 10
          # 60 x 10s stays clear of spring.mvc.async.request-timeout=300s, so a pod saturated by
          # uploads about to time out is not killed for it
          failureThreshold: 60
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /services/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        startupProbe:
          # httpGet, not tcpSocket: the connector binds before Camel starts, so a tcpSocket probe
          # succeeds immediately and gates nothing
          httpGet:
            path: /services/health
            port: 8080
          failureThreshold: 300
          periodSeconds: 1
    prometheus:
      enabled: true
      path: /actuator/prometheus
      port: 9001
    volumeMounts:
      - mountPath: /etc/application-config
        name: application-config
        readOnly: true
    volumes:
      - configMap:
          defaultMode: 420
          name: marduk-application
        name: application-config
  postgres:
    enabled: true
    memory: 40
    credentialsSecret: marduk-psql-credentials
  service:
    enabled: true
    internalPort: 8080
    externalPort: 8080
  ingress:
    enabled: true
  configmap:
    data:
      # IgnoreUnrecognizedVMOptions keeps the JVM starting if this chart is ever deployed against a
      # pre-JDK-24 image: --sun-misc-unsafe-memory-access does not exist there and would otherwise
      # kill the launcher before any log line.
      JDK_JAVA_OPTIONS:
        -server -Xss512k -Xmx5g -XX:+UseParallelGC -XX:GCTimeRatio=4
        -XX:AdaptiveSizePolicyWeight=90 -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40
        -XX:ActiveProcessorCount=2
        -XX:+IgnoreUnrecognizedVMOptions --enable-native-access=ALL-UNNAMED
        --sun-misc-unsafe-memory-access=allow
        -Dspring.config.location=/etc/application-config/application.properties
        -Dfile.encoding=UTF-8
      TZ: Europe/Oslo
    enabled: true
    toEnv: true
  secrets:
    psql-credentials:
      - SPRING_DATASOURCE_PASSWORD
      - SPRING_DATASOURCE_USERNAME
    auth:
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MARDUK_CLIENT_SECRET

line:
  statistics:
    calculation:
      enabled: false
