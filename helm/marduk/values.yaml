marduk:
  database: marduk
common:
  app: marduk
  shortname: marduk
  team: ror
  deployment:
    replicas: 2
    # A cap, not a wait: a healthy shutdown still exits in seconds. It has to cover the sum of, in order,
    # 10s per PubSub subscriber that is mid-callback at SIGTERM, the 60s drain, the 30s graceful HTTP
    # shutdown, and bean destruction - templates/configmap.yaml derives each one. 60 + 30 of that is fixed,
    # so 180 leaves 90s for the subscriber close and bean destruction, which is nine busy subscribers at
    # 10s each; 120 left 30s, or three with nothing to spare. Enabling graceful HTTP shutdown at the
    # previous 90s phase timeout would have overrun 120 outright, which ConfigMapInvariantsTest now catches.
    # The ceiling of all 22 busy at once is 310s and is deliberately not covered: reaching it needs a long
    # callback on every subscription simultaneously, and SIGKILL would then land during the subscriber
    # close, before the drain, abandoning the same work it abandons today.
    terminationGracePeriodSeconds: 180
  container:
    labels: { customLogRetention: enabled }
    forceReplicas: 2
    image: <+artifacts.primary.image>
    memoryLimit: 8000
    memory: 7000
    cpu: 2
    envFrom:
      - secretRef:
          name: marduk-auth
    probes:
      # spec replaces the chart's whole probe block, which emits no timeoutSeconds and so gets
      # the 1s k8s default - too tight for a path that shares its thread pool with 150MB uploads.
      # Both probes target /services/health rather than /actuator/health because it reports on the
      # layer that serves the API: a pod not serving /services/** fails it, while the actuator
      # health group stays UP in that state. Liveness thresholds are deliberately slack so pool
      # saturation recycles nothing, but a permanently broken pod is still replaced.
      spec:
        livenessProbe:
          httpGet:
            path: /services/health
            port: 8080
          initialDelaySeconds: 140
          periodSeconds: 10
          # 10 minutes: a pod whose request threads are all busy with 150MB uploads is not killed
          # for it
          failureThreshold: 60
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /services/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        startupProbe:
          # httpGet, not tcpSocket: the connector binds before the application can serve /services/**,
          # so a tcpSocket probe succeeds immediately and gates nothing
          httpGet:
            path: /services/health
            port: 8080
          failureThreshold: 300
          periodSeconds: 1
    prometheus:
      enabled: true
      path: /actuator/prometheus
      port: 9001
    volumeMounts:
      - mountPath: /etc/application-config
        name: application-config
        readOnly: true
    volumes:
      - configMap:
          defaultMode: 420
          name: marduk-application
        name: application-config
  postgres:
    enabled: true
    memory: 40
    credentialsSecret: marduk-psql-credentials
  service:
    enabled: true
    internalPort: 8080
    externalPort: 8080
  ingress:
    enabled: true
  configmap:
    data:
      # IgnoreUnrecognizedVMOptions keeps the JVM starting if this chart is ever deployed against a
      # pre-JDK-24 image: --sun-misc-unsafe-memory-access does not exist there and would otherwise
      # kill the launcher before any log line.
      JDK_JAVA_OPTIONS:
        -server -Xss512k -Xmx5g -XX:+UseParallelGC -XX:GCTimeRatio=4
        -XX:AdaptiveSizePolicyWeight=90 -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40
        -XX:ActiveProcessorCount=2
        -XX:+IgnoreUnrecognizedVMOptions --enable-native-access=ALL-UNNAMED
        --sun-misc-unsafe-memory-access=allow
        -Dspring.config.location=/etc/application-config/application.properties
        -Dfile.encoding=UTF-8
      TZ: Europe/Oslo
    enabled: true
    toEnv: true
  secrets:
    psql-credentials:
      - SPRING_DATASOURCE_PASSWORD
      - SPRING_DATASOURCE_USERNAME
    auth:
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MARDUK_CLIENT_SECRET

line:
  statistics:
    calculation:
      enabled: false
